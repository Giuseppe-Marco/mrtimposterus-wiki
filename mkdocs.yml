site_name: MRTImposterUs Wiki
site_description: The complete guide to MRTImposterUs, an Among Us-style minigame plugin for Paper.
site_author: MRT
# Change this after creating the GitHub repository:
#   https://<your-github-name>.github.io/<repository-name>/
site_url: https://giuseppe-marco.github.io/mrtimposterus-wiki/
copyright: Copyright &copy; MRT - MRTImposterUs

theme:
  name: material
  language: en
  # To use your own logo: put logo.png in docs/assets/ and replace the icon
  # block below with:  logo: assets/logo.png  and  favicon: assets/logo.png
  icon:
    logo: material/knife
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra:
  social:
    - icon: simple/modrinth
      link: https://modrinth.com/plugin/mrtimposterus
      name: MRTImposterUs on Modrinth

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Your first arena: getting-started/first-arena.md
      - Configuration files: getting-started/configuration.md
      - Per-arena settings: getting-started/arena-settings.md
  - Gameplay:
      - How a match works: gameplay/match.md
      - Tasks: gameplay/tasks.md
      - Sabotages: gameplay/sabotages.md
      - Vents: gameplay/vents.md
      - Meetings & voting: gameplay/meetings.md
      - Ghosts: gameplay/ghosts.md
      - Knife & resource pack: gameplay/knife.md
      - Ship map: gameplay/ship-map.md
      - Anonymity & tab list: gameplay/anonymity.md
      - Streamer mode: gameplay/streamer-mode.md
  - Server features:
      - Hub, NPCs & signs: features/hub.md
      - Chat: features/chat.md
      - Scoreboard: features/scoreboard.md
      - Stats, levels & rewards: features/progression.md
  - Reference:
      - Commands: reference/commands.md
      - Permissions: reference/permissions.md
      - Placeholders: reference/placeholders.md
      - Admin tools: reference/admin-tools.md
      - Developer API: reference/api.md
  - FAQ: faq.md
  - Changelog: changelog.md
